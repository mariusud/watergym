[project]
name = "watergym"
version = "0.1.0"
description = "GPU-batched reinforcement learning gym for vessels in waves"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=1.26",
    "torch>=2.4",
]

[project.optional-dependencies]
viz = [
    "imgui-bundle>=1.92",
    "newton>=1.6",
    "pillow>=11",
    "pyglet>=2.1.6,<3",
    "warp-lang>=1.17",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/watergym"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N"]
ignore = ["N802", "N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
