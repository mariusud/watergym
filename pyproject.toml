[project]
name = "watergym"
version = "0.1.0"
description = "GPU-batched reinforcement learning gym for vessels in waves"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["reinforcement-learning", "gym", "hydrofoil", "waves", "marine", "pytorch", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "torch>=2.4",
]

[project.urls]
# TODO: replace with the real repository URL once it is public.
Repository = "https://github.com/mariusud/watergym"

[project.optional-dependencies]
viz = [
    "imgui-bundle>=1.92",
    "newton>=1.6",
    "pillow>=11",
    "pyopengl>=3.1",
    "pyglet>=2.1.6,<3",
    "warp-lang>=1.17",
]
rl = [
    "rsl-rl-lib>=5.5.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/src/watergym", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/watergym"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N"]
ignore = ["N802", "N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
